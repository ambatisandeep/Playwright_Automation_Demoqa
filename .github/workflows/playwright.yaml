name: Playwright Advanced CI

on:
  push:
    branches: [ main, master,integration ]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CI: true

jobs:
  build:
    name: Build (Install Dependencies)
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache dependencies (better than copying site-packages)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Restore cache (fast install)
      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare folders
        run: |
          mkdir -p screenshots
          mkdir -p allure-results

      - name: Run tests (parallel + retry + allure)
        run: |
          pytest --alluredir=allure-results

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: |
            screenshots/
            allure-results/

  deploy:
    name: Deploy Reports
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts

      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre wget unzip

          ALLURE_VERSION=2.27.0
          wget https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip

          unzip allure-${ALLURE_VERSION}.zip
          sudo mv allure-${ALLURE_VERSION} /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4